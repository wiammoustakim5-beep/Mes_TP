<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modale de notification</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modale{
            display:none;
            position:fixed;
            width:100%;
            height:100%;
            top:0px;
            left:0px;
            background-color: rgba(0, 0, 0, 0.183);
            z-index:1000;
        }
        .modale-contenue{
            background:white;
            width:400px;
            margin: 15% auto;
            padding:20px;
            border-radius:10px;
            text-align: center;
        }
         button {
      padding: 20px 60px;
      border: none;
      border-radius: 5px;
      background-color: rgb(28, 101, 203);
      color: white;
      cursor: pointer;
    }
     button:hover{
        background-color:rgb(43, 43, 216) ;
     }

    </style>
</head>
<body>
    <button id="btn1">Ouvrire</button>
    <div id="modale" class="modale">
        <div class="modale-contenue"><h1>Bienvenue ! Ceci est une notification</h1>
        <button id="btn2">Fermer</button></div>
    </div>
    <script>
        let btn1=document.getElementById("btn1");
        let modale=document.getElementById("modale");
        let btn2=document.getElementById("btn2");
        btn1.addEventListener("click",function(){
            modale.style.display="block";
        });
        btn2.addEventListener("click",function(){
            modale.style.display="none";
        });
    </script>
</body>
</html>
