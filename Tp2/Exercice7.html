<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div id="time">Temps écoulé:0 secondes</div>  
</body>
<script>
    let seconde=0;
    let element=document.querySelector("#time");
    setInterval(()=>{
        seconde++;
        element.textContent="Temps écoule est :"+seconde+ " secondes";

    },1000);
</script>
</html>
