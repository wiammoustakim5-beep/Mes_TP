<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:85px;
            display:flex ;
            align-items:center;
            justify-content:center;
        }
        .box{
            width:400px;
            height:400px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:black;
            font-family:Arial, sans-serif;
            background-color: darkolivegreen;
            cursor: pointer;

        }
    </style>
</head>
<body>
    <div  class="box" id="monDiv">Passez la souris ici</div>
</body>
<script>
    let box=document.getElementById("monDiv");
    box.addEventListener("mouseover",function(){
        box.style.backgroundColor="pink";
    });
    box.addEventListener("mouseout",function(){
    box.style.backgroundColor="darkolivegreen";
    });
</script>
</html>
