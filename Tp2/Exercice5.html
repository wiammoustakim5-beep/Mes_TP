<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .carousel{
            display:flex;
            align-items:center;
            justify-content: center;
            margin-top:50px;
            margin-bottom:50px;

        }
        #monImage{
            width:500px;
            object-fit:cover;
        }
    </style>
</head>
<body>
    <div class="carousel">
     <button id="precedent">précedent</button>
    <img id="monImage" src="image/image1.jpg" alt="image 1">
    <button id="suivant">suivant</button>
</div>
<script>
    const images = [ "image/image1.jpg","image/image2.jpg", "image/image3.jpg", "image/image4.jpg","image/image5.jpg"];
    let index=0;
    const precedent=document.getElementById("precedent");
    const monImage=document.getElementById("monImage");
    const suivant=document.getElementById("suivant");
    function afficher(){
        monImage.src=images[index];
    }
    suivant.addEventListener("click",function(){
      index=index+1;
      if(index>=images.length){
        index=0;
      }
      afficher();
    });
    precedent.addEventListener("click",function(){
        index=index-1;
        if(index<0){
            index=images.length-1;
        }
        afficher();
    });
</script>
</body>
</html>
