<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="monBloc" style="width: 200px; height: 100px; background-color: lightgray; margin-bottom: 10px;"></div>
<button onclick="changerCouleur()">Changer la couleur</button>

<script>
function changerCouleur() {
  const bloc = document.getElementById("monBloc");
  bloc.style.backgroundColor = "aqua";
}
</script>
</body>
</html>
